# 无名岛（Incognito）容器化本地预览
#
# 用法：
#   docker compose -f deploy/docker-compose.yaml up --build
#   打开 http://localhost:3000
#
# 说明：镜像以 wrangler 本地(workerd)模式运行构建产物 + 本地 D1；
# 匿名卷 incognito-state 持久化 Miniflare D1 状态（.wrangler/state），
# 重建/重启容器不丢数据。清理数据：docker compose -f deploy/docker-compose.yaml down -v

services:
  incognito:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: incognito:local
    container_name: incognito
    ports:
      - "3000:3000"
    volumes:
      - incognito-state:/app/.wrangler
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/boards').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  incognito-state:
