services:
  incognito:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: incognito:local
    container_name: incognito
    ports:
      - "3000:3000"
    environment:
      DATABASE_DRIVER: sqlite
      DATABASE_URL: /app/data/incognito.sqlite
      MEDIA_DIR: /app/data/media
    volumes:
      - incognito-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/boards').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  incognito-data:
